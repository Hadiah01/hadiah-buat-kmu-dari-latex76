<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan Buat Kamu</title>
  <link rel="stylesheet" href="confes.css">
</head>
<body>

<audio id="background-music" src="musik surat cinta.mp3"></audio>

<!-- LOADING SCREEN -->
<div id="loading" class="loading hidden">
  <div class="loaderBar"></div>
  <p class="loading-text">Membuka pesan…</p>
</div>

<!-- POPUP 0 -->
<div id="popup0" class="popup hidden">
  <div class="popup-header">Message</div>
  <div class="popup-content">
    <img src="Stiker 1 (SFILE.MOBI).gif">
    <p>Silakan login untuk membuka pesan 😊</p>
    <input id="nameInput" type="text" placeholder="Tulis Nama Panggilan Kamu..." />
  </div>
  <div class="popup-footer">
    <button onclick="saveName()">Lanjut</button>
  </div>
</div>

<!-- POPUP 1 -->
<div id="popup1" class="popup hidden">
  <div class="popup-header">Message</div>
  <div class="popup-content">
    <img src="Stiker 1 (SFILE.MOBI).gif">
    <h3 id="typing-text"
       data-text="Hay {nama}… aku cuma pengen nyampaiin sesuatu. Semoga {nama} mau baca sampai selesai yaa…">
    </h3>
  </div>
  <div class="popup-footer">
    <button onclick="showNextPopup('popup1','popup2','typing-text-2','typing-text-3')">
      Tentang apa?
    </button>
  </div>
</div>

<!-- POPUP 2 -->
<div id="popup2" class="popup hidden">
  <div class="popup-header">Message</div>
  <div class="popup-content">
    <img src="Stiker 36 (SFILE.MOBI).gif">
    <h3 id="typing-text-2"
        data-text="Sebenarnya aku udaa lama nyimpen perasaan inii."></h3>
    <h3 id="typing-text-3"
        data-text="Setiap ada kamu {nama}, hatiku terasa lebih tenang dan nyaman 👉👈."></h3>
  </div>
  <div class="popup-footer">
    <button onclick="showNextPopup('popup2','popup3','typing-text-4')">
      Aku juga punya rasa yang sama 🥺
    </button>
  </div>
</div>

<!-- POPUP 3 -->
<div id="popup3" class="popup hidden">
  <div class="popup-header">Message</div>
  <div class="popup-content">
    <img src="Stiker 15 (SFILE.MOBI).gif">
    <h3 id="typing-text-4"
        data-text="Aku gaa minta apa-apa. Aku cuma pengen lebih dekat dengan kamu {nama}.">
    </h3>
  </div>

  <div class="popup-footer popup-footer-relative">
    <button onclick="showNextPopup('popup3','popup4','typing-text-5')">
      Iyaa, aku mauu 🤍
    </button>

    <button id="btnNo" class="btn-kabur" onclick="handleNoClick()">
      Aku belum siap
    </button>
  </div>
</div>

<!-- POPUP 4 -->
<div id="popup4" class="popup hidden">
  <div class="popup-header">Message</div>
  <div class="popup-content">
    <img src="Stiker 2 (SFILE.MOBI).gif">
    <h3 id="typing-text-5"
        data-text="Makasih udaa nerimaa perasaann inii 🤍"></h3>
  </div>
  <div class="popup-footer">
    <button onclick="showNextPopup('popup4','popup5','typing-text-6','typing-text-7')">
      Akuu sayangg kamuu
    </button>
  </div>
</div>

<!-- POPUP 5 -->
<div id="popup5" class="popup hidden">
  <div class="popup-header">Message</div>
  <div class="popup-content">
    <img src="Stiker 41 (SFILE.MOBI).gif">
    <h3 id="typing-text-6"
        data-text="Semoga ini menjadi awal yang baik untuk kita berdua."></h3>
    <h3 id="typing-text-7"
        data-text="Pelan-pelan, tapi pasti dan seriusan 🤍"></h3>
  </div>
  <div class="popup-footer">
    <button id="wa-btn" onclick="openWhatsApp()">Aamiin 🤍</button>
  </div>
</div>

<!-- POPUP RAHASIA -->
<div id="popup6" class="popup hidden">
  <div class="popup-header">Message</div>
  <div class="popup-content">
    <img src="Stiker 32 (SFILE.MOBI).gif">
    <h3 id="typing-text-8"
        data-text="
Aku mengerti kok,
kalau kamu masih butuh waktu.
Makasih yaa udah jujur 🤍">
    </h3>
  </div>
  <div class="popup-footer">
    <button id="wa-code-btn" onclick="openWhatsAppCode()">Peluk Virtual 🤍</button>
  </div>
</div>

<!-- TOMBOL MULAI -->
<button id="show-popup-btn" class="show-popup-btn" onclick="startStory()">
  📩
  <p>Pesan belum dibaca!</p>
</button>

<script src="confes.js"></script>
</body>
</html>
